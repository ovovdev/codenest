<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}CodeNest</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<style>
  :root { --ink:#1c1917; --muted:#57534e; --accent:#047857; --bg:#faf9f7; --card:#ffffff; --line:#e7e5e4; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif; color:var(--ink); background:var(--bg); line-height:1.75; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px; }
  header.site { border-bottom:1px solid var(--line); background:var(--card); }
  header.site .wrap { display:flex; align-items:baseline; gap:14px; padding-top:16px; padding-bottom:16px; }
  .brand { font-size:22px; font-weight:800; color:var(--ink); text-decoration:none; letter-spacing:.2px; }
  .brand span { color:var(--accent); }
  .tagline { color:var(--muted); font-size:13px; }
  main { padding: 28px 0 48px; }
  h1 { font-size:28px; line-height:1.35; margin: 8px 0 18px; }
  h2 { font-size:20px; margin: 30px 0 10px; padding-top:6px; }
  p, li { font-size:16px; }
  a { color:var(--accent); }
  blockquote { margin:16px 0; padding:12px 16px; background:#ecfdf5; border:1px solid #a7f3d0; border-radius:10px; }
  blockquote p { margin:0; font-size:17px; }
  code { background:#f5f5f4; padding:1px 6px; border-radius:6px; font-size:.92em; }
  .back { display:inline-block; margin-bottom:6px; font-size:14px; text-decoration:none; }
  .cards { display:grid; gap:10px; margin: 10px 0 6px; padding:0; list-style:none; }
  .cards a { display:block; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 16px; text-decoration:none; color:var(--ink); font-weight:600; }
  .cards a:hover { border-color:var(--accent); }
  footer.site { border-top:1px solid var(--line); color:var(--muted); font-size:13px; padding: 20px 0 36px; }
</style>
</head>
<body>
<header class="site">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">Code<span>Nest</span></a>
    <span class="tagline">亲测邀请码 · 流程与优惠写清楚</span>
  </div>
</header>
<main>
  <div class="wrap">
    {% if page.url != "/" %}<a class="back" href="{{ '/' | relative_url }}">← 全部指南</a>{% endif %}
    {{ content }}
  </div>
</main>
<footer class="site">
  <div class="wrap">
    本站部分链接为邀请链接：通过本站注册或下单，站长可能获得邀请奖励，你的优惠与直接注册一致，不会多付费用。优惠金额与政策以各产品官方页面为准；内容不构成理财或投资建议。© 2026 CodeNest
  </div>
</footer>
</body>
</html>
